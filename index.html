<!DOCTYPE html>
<html lang="en">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      line-height: 1.6;
      padding: 0 16px;
    }
  </style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Web - Live on GitHub Pages</title>
</head>
<body>
  <h1>Hello from Cursor!</h1>
  <p>This change was edited in Cursor and will be pushed to GitHub.</p>
  <h2>About this page</h2>
  <p>This is my first simple webpage hosted from GitHub.</p>
  <p>It is now published with GitHub Pages.</p>
  <button id="helloButton">Click me</button>
  <script>
    const button = document.getElementById("helloButton");
    let clicked = false;
  
    button.addEventListener("click", function () {
      if (!clicked) {
        button.textContent = "You clicked me!";
        clicked = true;
      } else {
        button.textContent = "Click me";
        clicked = false;
      }
    });
  </script>
</body>
</html>
